# Fly.io config — serves the Alpha Brawl game and the WS relay on one app.
# Replace the `app` value below with whatever you pick during `fly launch`
# (must be globally unique across Fly).

app = "alphafight"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
