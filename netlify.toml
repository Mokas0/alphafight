# Static site — index.html and sprites/ are served from the repo root as-is.
#
# NOTE: this file is currently NOT the one driving the deploy. The Netlify
# site has its UI "Base directory" field set to the branch name
# (claude/deploy-to-netlify-518LD), so Netlify reads the netlify.toml inside
# THAT directory instead. See claude/deploy-to-netlify-518LD/README.md for the
# full explanation and how to undo it.
#
# Once the Base directory field is cleared in the Netlify UI and the claude/
# directory is deleted, this file takes over again and needs no changes.
#
# Deliberately no `base` key here: setting one cannot fix a bad UI base
# directory, because Netlify uses the base directory to locate this file
# before it ever parses it.

[build]
  publish = "."
